name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@^11

      - run: npm ci --no-audit --no-fund

      - name: Verify the install actually completed
        run: npx --no-install vitest --version

      - run: npm test
