name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Separate job so GitHub treats the guard as an independently required
  # check-run. When this job is required in branch protection, a PR whose
  # run was built from a cached merge commit (and therefore has no ui-guard
  # job at all) is blocked with "Expected — Waiting", not silently green.
  #
  # The test -f guard exists because pull_request events run the workflow
  # from the MERGE tree: branches cut before the script exists would fail
  # with MODULE_NOT_FOUND wearing this step's name. It self-skips there
  # (job conclusion = success), and starts enforcing the moment the script
  # lands on main.
  ui-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # Must be a full clone: the guard diffs HEAD against the merge
          # base, which a shallow clone does not contain.
          fetch-depth: 0

      - name: Check for silently removed UI
        run: |
          test -f scripts/check-removed-ui.mjs || { echo "guard script not on this branch yet - skipping"; exit 0; }
          node scripts/check-removed-ui.mjs "origin/${{ github.base_ref }}"

  vitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@^11

      - name: Validate lockfile
        run: |
          node scripts/validate-lockfile.mjs
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: bash scripts/npm-ci-retry.sh

      - name: Verify the install actually completed
        run: npx --no-install vitest --version

      - run: npm test
